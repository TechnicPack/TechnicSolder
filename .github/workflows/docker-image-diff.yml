name: Docker image diff

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docker-image-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  describe:
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Inspect registry metadata only; never check out or execute PR code.
      - name: Compare pinned Docker images
        uses: TechnicPack/docker-image-diff@4f09bbb05499ffee9f6b655560746d29dc0818b4 # v1.0.2
        with:
          allowed-registries: docker.io
